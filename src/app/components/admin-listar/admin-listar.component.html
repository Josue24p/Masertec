<div class="container-fluid mt-4">
  <!-- Registro de Producto -->
  <section class="product-form mb-5">
    <h1>Registrar Producto</h1>
    <form class="mt-4">
      <div class="row mb-3">
        <!-- Código -->
        <div class="col-md-6">
          <label for="codigo" class="form-label">Código</label>
          <input type="text" class="form-control" id="codigo" placeholder="Ingrese el código del producto">
        </div>
        <!-- Nombre -->
        <div class="col-md-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Ingrese el nombre del producto">
        </div>
      </div>
      <div class="row mb-3">
        <!-- Descripción -->
        <div class="col-md-6">
          <label for="descripcion" class="form-label">Descripción</label>
          <input type="text" class="form-control" id="descripcion" placeholder="Ingrese una breve descripción">
        </div>
        <!-- Detalles -->
        <div class="col-md-6">
          <label for="detalles" class="form-label">Detalles</label>
          <input type="text" class="form-control" id="detalles" placeholder="Ingrese detalles del producto">
        </div>
      </div>
      <div class="row mb-3">
        <!-- Imagen -->
        <div class="col-md-6">
          <label for="imagen" class="form-label">Imagen</label>
          <input type="file" class="form-control" id="imagen">
        </div>
      </div>
      <!-- Botones -->
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-success me-2">Guardar</button>
        <button type="reset" class="btn btn-secondary">Limpiar</button>
      </div>
    </form>
  </section>

  <!-- Lista de Productos -->
  <section class="product-list">
    <h1>Lista de Productos</h1>
    <div class="search-register d-flex justify-content-between align-items-center mb-3">
      <div class="search-container d-flex">
        <input type="text" placeholder="Buscar" id="search" class="form-control w-50">
        <button id="register-btn" class="btn btn-primary ms-3">REGISTRAR</button>
      </div>
    </div>
    <!-- Tabla Responsive -->
    <div class="table-responsive">
      <table class="table table-hover">
        <thead class="table-dark">
          <tr>
            <th scope="col">Código</th>
            <th scope="col">Nombre</th>
            <th>Descripción</th>
            <th>Detalles</th>
            <th>Imagen</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>001</td>
            <td>Impresora HP LaserJet</td>
            <td>Impresora láser monocromática</td>
            <td>Velocidad: 20ppm, Resolución: 1200dpi</td>
            <td><img src="https://via.placeholder.com/50" alt="Impresora HP" class="img-fluid rounded"></td>
            <td>
              <button class="btn btn-success btn-sm me-2">Modificar</button>
              <button class="btn btn-danger btn-sm">Eliminar</button>
            </td>
          </tr>
          <!-- Más filas aquí -->
        </tbody>
      </table>
    </div>
  </section>
</div>
