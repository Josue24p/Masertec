<div class="container-fluid mt-4">
  <!-- Registro de Producto -->
  <section class="product-form mb-5">
    <h1>Registrar Producto</h1>
    <form (submit)="registrarProducto()" class="mt-4">
      <div class="row mb-3">
        <!-- Nombre -->
        <div class="col-md-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Ingrese el nombre del producto" [(ngModel)]="nuevoProducto.prod_nombre" name="nombre">
        </div><!-- Descripción -->
        <div class="col-md-6">
          <label for="descripcion" class="form-label">Descripción</label>
          <input type="text" class="form-control" id="descripcion" placeholder="Ingrese una breve descripción" [(ngModel)]="nuevoProducto.prod_descripcion" name="descripcion">
        </div>
      </div>
      <div class="row mb-3">
        <!-- Imagen -->
        <div class="col-md-6">
          <label for="imagen" class="form-label">Imagen</label>
          <input type="file" class="form-control" id="imagen" (change)="onFileSelected($event)">
        </div>
        <!-- Subcategoría -->
        <div class="col-md-6">
          <label for="subcategoria">Seleccione una subcategoría:</label>
          <select id="subcategoria" class="form-control" [(ngModel)]="nuevoProducto.id_subcategoria" name="subcategoria">
            <option *ngFor="let sub of subcategorias" [value]="sub.id_subcategoria">
              {{ sub.subcat_nombre }}
            </option>
          </select>
        </div>
      </div>

      <!-- Botones -->
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-primary me-2" (click)="actualizarProducto()" [disabled]="!editando">Confirmar</button>
        <button type="submit" class="btn btn-success me-2" [disabled]="editando">Guardar</button>
        <button type="reset" class="btn btn-secondary">Limpiar</button>
      </div>
    </form>
  </section>

  <!-- Lista de Productos -->
  <section class="product-list">
    <h1>Lista de Productos</h1>
    <div class="search-register d-flex justify-content-between align-items-center mb-3">
      <div class="search-container d-flex">
        <input type="text" placeholder="Buscar" id="search" class="form-control w-50">
        <button id="register-btn" class="btn btn-primary ms-3">REGISTRAR</button>
      </div>
    </div>
    <!-- Tabla Responsive -->
    <div class="table-responsive">
      <table class="table table-hover">
        <thead class="table-dark">
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>subcategoria</th>
            <th>Imagen</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let producto of productos">
            <td>{{ producto.id_producto }}</td>
            <td>{{ producto.prod_nombre }}</td>
            <td>{{ producto.prod_descripcion }}</td>
            <td>{{ producto.subcat_nombre }}</td>
            <td>
              <img 
                [src]="producto.prod_image ? 'http://localhost:4000/uploads/' + producto.prod_image: 'https://via.placeholder.com/50'" 
                alt="{{ producto.prod_nombre }}" 
                class="img-fluid rounded"
              />
            </td>
            <td>
              <button (click)="editarProducto(producto)" class="btn btn-success">Modificar</button>
              <button class="btn btn-danger">Eliminar</button>
            </td>
          </tr>
          <!-- Más filas aquí -->
        </tbody>
      </table>
    </div>
  </section>
</div>
