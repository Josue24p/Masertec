<div class="card">
  <h2>{{ title }}</h2>
  <img [src]="imageUrl" alt="{{ title }}" />
  <p>
    @for (line of text.split('\n'); track line; let i = $index) {
      <span>
        {{ line }}
        @if (i < text.split('\n').length - 1) {
          <br />
        }
      </span>
    }
  </p>

  @if (showButton) {
    <button (click)="onButtonClick()">{{ buttonText }}</button>
  }
</div>
