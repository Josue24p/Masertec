<h2>Lista de Contactos</h2>
<ul>
  <li *ngFor="let contacto of contactos">
    <strong>Nombre:</strong> {{ contacto.nombre_contacto }} <br>
    <strong>Correo:</strong> {{ contacto.correo_contacto }} <br>
    <strong>Teléfono:</strong> {{ contacto.telefono_contacto }} <br>
    <strong>Mensaje:</strong> {{ contacto.mensaje_contacto }} <br>
  </li>
</ul>
