<div class="lista-contactos">
  <h2 class="text-center mt-4">Bandeja de Contactos</h2>

  <div class="mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Buscar contacto..."
      [(ngModel)]="filtro"
      />
    </div>

    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Mensaje</th>
        </tr>
      </thead>
      <tbody>
        @for (contacto of contactos | filter: filtro; track contacto) {
          <tr>
            <td>{{ contacto.nombre_contacto }}</td>
            <td>{{ contacto.correo_contacto }}</td>
            <td>{{ contacto.telefono_contacto }}</td>
            <td>{{ contacto.mensaje_contacto }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
