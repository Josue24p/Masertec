
<div class="container row m-0 mx-auto p-3 py-md-3 m-5">
    <!-- Columna de imagen -->
    <div class="col-md-6 col-12 p-4">
        <div class="d-flex align-items-start">
            <img class="lottery-svg2" width="101" height="70" src="https://static.pchujoy.com/public/img/ornaments/Home3.webp" alt="home3-image">
        </div>
      <img src="https://www.ecommercenews.pe/wp-content/uploads/2022/01/atencion-al-cliente.png" alt="soporte" class="img-fluid" style="max-width: 100%; padding-top: 3em;">
    </div>

    <!-- Columna de texto -->
    <div class="col-md-6 col-12 p-4">
        <div class="d-flex align-items-start">
      <svg class="us-asset-3 mb-3" width="44" height="8" viewBox="0 0 44 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M44 0H0V8H44V0Z" fill="#FFBB33"></path>
      </svg>
    </div>
      <h3 class="my-0 text-center mb-4">
        <b class="prim-text-color">CONTACTANOS</b>
      </h3>
      <div class="container d-flex justify-content-center">
        <div class="card p-4" style="width: 100%; max-width: 500px;">
          <form [formGroup]="formularioContacto" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" formControlName="nombre" class="form-control" id="nombre">
            </div>
          
            <div class="mb-3">
              <label for="celular" class="form-label">Teléfono</label>
              <input type="text" formControlName="celular" class="form-control" id="celular">
            </div>
          
            <div class="mb-3">
              <label for="tipoEmail" class="form-label">Correo Electrónico</label>
              <input type="email" formControlName="tipoEmail" class="form-control" id="tipoEmail">
            </div>
          
            <div class="mb-3">
              <label for="tamanio" class="form-label">Mensaje</label>
              <input type="text" formControlName="tamanio" class="form-control" id="tamanio">
            </div>
          
            <button type="submit" class="btn btn-primary w-100">Enviar</button>
          </form>
          <!--[disabled]="formularioContacto.invalid"-->
        </div>
      </div>

      <div class="mt-4 text-md-end text-sm-end">
      <img class="lottery-svg2 mt-4" width="101" height="100" src="https://static.pchujoy.com/public/img/ornaments/Home3.webp" alt="home3-image">
    </div>
    </div>
  </div>
