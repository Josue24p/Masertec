
<div class="container row m-0 mx-auto p-3 py-md-3 m-5">
    <!-- Columna de imagen -->
    <div class="col-md-6 col-12 p-4">
        <div class="d-flex align-items-start">
            <img class="lottery-svg2" width="101" height="70" src="https://static.pchujoy.com/public/img/ornaments/Home3.webp" alt="home3-image">
        </div>
      <img src="https://www.ecommercenews.pe/wp-content/uploads/2022/01/atencion-al-cliente.png" alt="soporte" class="img-fluid" style="max-width: 100%; padding-top: 3em;">
    </div>

    <!-- Columna de texto -->
    <div class="col-md-6 col-12 p-4">
        <div class="d-flex align-items-start">
      <svg class="us-asset-3 mb-3" width="44" height="8" viewBox="0 0 44 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M44 0H0V8H44V0Z" fill="#FFBB33"></path>
      </svg>
    </div>
      <h3 class="my-0 text-center mb-4">
        <b class="prim-text-color">CONTACTANOS</b>
      </h3>
      <div class="container d-flex justify-content-center">
        <div class="card p-4" style="width: 100%; max-width: 500px;">
          <form [formGroup]="formularioContacto">

            <div class="mb-3">
              <label for="empresa" class="form-label">Empresa</label>
              <input type="text"
              [ngClass]="{'is-invalid': hasErrors('nombre','required')}"
              formControlName="nombre"
              class="form-control" id="empresa"
               >
              <div class="text-danger" *ngIf="hasErrors('nombre','required')">Campo obligatorio</div>
            </div>

            <div class="mb-3">
              <label for="telefono" class="form-label">Telefono</label>
              <input type="text"
              [ngClass]="{'is-invalid': hasErrors('celular','required')}"
              formControlName="celular"
              class="form-control" id="celular">
            </div>
            <div class="text-danger" *ngIf="hasErrors('celular','required')">Campo obligatorio</div>
            <div class="text-danger" *ngIf="hasErrors('celular', 'pattern')">Debe ser un número válido que comience con 9 y tenga 9 dígitos.</div>


            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email"
              [ngClass]="{'is-invalid': hasErrors('tipoEmail','required')||hasErrors('tipoEmail','email')}"
              formControlName="tipoEmail"
               class="form-control" id="correo" aria-describedby="emailHelp">
              <div id="emailHelp" class="form-text">Nunca compartiremos tu correo con nadie.</div>
              <div class="text-danger" *ngIf="hasErrors('tipoEmail','required')">Campo obligatorio</div>
              <div class="text-danger" *ngIf="hasErrors('tipoEmail','email')">Formato incorrecto</div>
            </div>
            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje</label>
              <input type="text" class="form-control" id="mensaje">
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar</button>
          </form>
        </div>
      </div>

      <div class="mt-4 text-md-end text-sm-end">
      <img class="lottery-svg2 mt-4" width="101" height="100" src="https://static.pchujoy.com/public/img/ornaments/Home3.webp" alt="home3-image">
    </div>
    </div>
  </div>
