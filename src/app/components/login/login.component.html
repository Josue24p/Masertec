<link
  href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css"
  rel="stylesheet"
  />

  <div
    class="bg-orange-900 absolute top-0 left-0 bg-gradient-to-b from-gray-900 via-gray-900 to-orange-800 bottom-0 leading-5 h-full w-full overflow-hidden"
  ></div>

  <div
    class="relative min-h-screen flex flex-col sm:flex-row justify-center bg-transparent rounded-3xl shadow-xl"
    >
    <!-- Imagen fija, oculta en pantallas pequeñas -->
    <div
      class="hidden sm:flex flex-col self-center lg:px-14 sm:max-w-4xl xl:max-w-md z-10"
      >
      <div class="self-start flex flex-col text-gray-300">
        <img
          src="https://masertecperu.com/imagenes/bienvenido.png"
          alt="Bienvenido"
          class="w-150 mb-4"
          />
        </div>
      </div>

      <!-- Formulario centrado -->
      <div class="flex justify-center self-center z-10 w-full sm:w-auto">
        <div
          class="p-6 sm:p-10 md:p-12 bg-white mx-4 sm:mx-auto rounded-3xl w-full sm:w-96 max-w-md shadow-lg"
          >
          <!-- Encabezado del formulario -->
          <div class="text-center mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">Inicia Sesión</h2>
            <p class="text-gray-500 text-sm">
              ¿No tienes una cuenta?
              <a href="#" class="text-purple-700 hover:underline">Regístrate</a>
            </p>
          </div>

          <!-- Formulario -->
          <form class="space-y-6" (ngSubmit)="onSubmit()">
            <!-- Campo Email -->
            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-600 mb-1"
                >Correo electrónico</label
                >
                <input
                  id="email"
                  type="email"
                  name="email"
                  [(ngModel)]="email"
                  placeholder="Ingresa tu correo"
                  class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
                  required
                  />
                </div>

                <!-- Campo Password -->
                <div>
                  <label
                    for="password"
                    class="block text-sm font-medium text-gray-600 mb-1"
                    >Contraseña</label
                    >
                    <input
                      id="password"
                      type="password"
                      name="password"
                      [(ngModel)]="password"
                      placeholder="Ingresa tu contraseña"
                      class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
                      required
                      />
                    </div>

                    <!-- Enlace de contraseña olvidada -->
                    <div class="text-right">
                      <a href="#" class="text-sm text-purple-700 hover:underline"
                        >¿Olvidaste tu contraseña?</a
                        >
                      </div>

                      <!-- Botón de inicio de sesión -->
                      <div>
                        <button
                          type="submit"
                          class="w-full bg-purple-800 text-white font-semibold py-3 rounded-lg hover:bg-purple-700 transition duration-300"
                          >
                          Iniciar Sesión
                        </button>
                      </div>
                    </form>

                    <!-- Mensaje de error -->
                    @if (errorMessage) {
                      <p class="text-red-600 text-sm mt-3">
                        {{ errorMessage }}
                      </p>
                    }
                  </div>
                </div>
              </div>
